<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        document.documentElement.setAttribute("data-theme", t === "day" ? "day" : "night");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "night");
      }
    })();
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Full archive of posts on FUSION!" />
  <title>Archive · FUSION!</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <script src="/assets/js/i18n.js" defer></script>
  <script src="/assets/js/site.js" defer></script>
</head>
<body data-title-key="page_title">
  <header class="site-header">
    <div class="wrapper header-inner">
      <div class="brand">
        <a href="/">
          <img src="/images/avatar.png" alt="" width="42" height="42" />
          <div class="brand-text">
            <div class="title">FUSION!</div>
            <div class="subtitle" data-i18n="brand_sub">朱博文</div>
          </div>
        </a>
      </div>
      <nav class="nav" aria-label="Primary">
        <a data-nav="home" data-i18n="nav_home" href="/">首页</a>
        <a data-nav="research" data-i18n="nav_research" href="/research/">研究</a>
        <a data-nav="notes" data-i18n="nav_notes" href="/notes/">随笔</a>
        <a data-nav="videos" data-i18n="nav_videos" href="/videos/">视频</a>
        <a data-nav="about" data-i18n="nav_about" href="/about/">关于</a>
        <a data-nav="archives" data-i18n="nav_archives" href="/archives/">归档</a>
      </nav>
      <div class="header-actions">
        <button type="button" class="button secondary" id="theme-toggle" title="Day" aria-label="Switch theme">☀</button>
        <button type="button" class="button secondary" id="lang-toggle" data-i18n="lang_toggle">EN</button>
      </div>
    </div>
  </header>

  <main class="wrapper">
    <header class="page-intro">
      <h1 data-i18n="arch_title">全部文章</h1>
      <p class="lede" data-i18n="arch_sub">按年份列出；可用筛选切换研究 / 随笔。</p>
    </header>

    <section class="section">
      <div id="arch-filters" class="filter-bar"></div>
      <div class="page-panel" style="margin-top:8px;">
        <div id="archive-root"></div>
        <p id="arch-error" class="muted" style="display:none;"></p>
      </div>
    </section>
  </main>

  <footer class="site-footer wrapper">
    <div data-i18n="footer_line1">朱博文 · 等离子体计算 / 物理信息机器学习</div>
    <div data-i18n="footer_line2">drawingsword.com · 静态托管于 GitHub Pages</div>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      SiteI18n.register({
        zh: {
          page_title: "归档 · FUSION!",
          arch_title: "全部文章",
          arch_sub: "按年份分组；可筛选研究 / 随笔。",
        },
        en: {
          page_title: "Archive · FUSION!",
          arch_title: "All posts",
          arch_sub: "Grouped by year; filter research vs notes.",
        },
      });
      SiteI18n.apply(SiteI18n.getLang());

      let posts = [];
      let lane = "all";

      async function boot() {
        try {
          const data = await Site.loadJSON("/data/posts.json");
          posts = (data.posts || []).filter((p) => !p.hidden);
          buildFilters();
          render();
        } catch (e) {
          console.error(e);
          const err = document.getElementById("arch-error");
          if (err) {
            err.style.display = "block";
            err.textContent = SiteI18n.t("load_error");
          }
        }
      }

      function buildFilters() {
        const bar = document.getElementById("arch-filters");
        if (!bar) return;
        const items = [
          ["all", SiteI18n.t("filter_all")],
          ["research", SiteI18n.t("filter_research")],
          ["notes", SiteI18n.t("filter_notes")],
        ];
        bar.innerHTML = items
          .map(
            ([k, label]) =>
              `<button type="button" data-lane="${k}" class="${k === lane ? "is-active" : ""}">${Site.escapeHtml(label)}</button>`
          )
          .join("");
        bar.querySelectorAll("button").forEach((btn) => {
          btn.addEventListener("click", () => {
            lane = btn.getAttribute("data-lane") || "all";
            buildFilters();
            render();
          });
        });
      }

      function render() {
        const lang = SiteI18n.getLang();
        let list = posts.slice();
        if (lane !== "all") list = list.filter((p) => p.lane === lane);
        list.sort((a, b) => (b.date || "").localeCompare(a.date || ""));

        const byYear = {};
        list.forEach((p) => {
          const y = (p.date || "0000").slice(0, 4);
          (byYear[y] || (byYear[y] = [])).push(p);
        });
        const years = Object.keys(byYear).sort((a, b) => b.localeCompare(a));
        const root = document.getElementById("archive-root");
        if (!root) return;
        if (!years.length) {
          root.innerHTML = `<p class="muted">${Site.escapeHtml(SiteI18n.t("empty_list", lang))}</p>`;
          return;
        }
        root.innerHTML = years
          .map((y) => {
            const rows = byYear[y]
              .map((p) => {
                const title = Site.pickTitle(p, lang);
                return `
                  <div class="archive-row">
                    <time datetime="${Site.escapeHtml(p.date || "")}">${Site.escapeHtml(Site.formatDate(p.date, lang))}</time>
                    <a href="${Site.escapeHtml(p.href)}">${Site.escapeHtml(title)}</a>
                    <span>${p.lane === "research" ? SiteI18n.t("badge_research", lang) : SiteI18n.t("badge_notes", lang)}</span>
                  </div>`;
              })
              .join("");
            return `<div class="year-block"><h3>${Site.escapeHtml(y)}</h3>${rows}</div>`;
          })
          .join("");
      }

      document.addEventListener("site:lang", () => {
        buildFilters();
        render();
      });
      boot();
    });
  </script>
</body>
</html>
