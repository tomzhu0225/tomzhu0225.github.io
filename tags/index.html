<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        document.documentElement.setAttribute("data-theme", t === "day" ? "day" : "night");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "night");
      }
    })();
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="0; url=/archives/" />
  <title>Tags · FUSION!</title>
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <script src="/assets/js/i18n.js" defer></script>
  <script src="/assets/js/site.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrapper header-inner">
      <div class="brand">
        <a href="/">
          <img src="/images/avatar.png" alt="" width="42" height="42" />
          <div class="brand-text">
            <div class="title">FUSION!</div>
            <div class="subtitle" data-i18n="brand_sub">朱博文</div>
          </div>
        </a>
      </div>
      <nav class="nav">
        <a data-i18n="nav_home" href="/">首页</a>
        <a data-i18n="nav_research" href="/research/">研究</a>
        <a data-i18n="nav_notes" href="/notes/">随笔</a>
        <a data-nav="videos" data-i18n="nav_videos" href="/videos/">视频</a>
        <a data-i18n="nav_archives" href="/archives/">归档</a>
      </nav>
      <div class="header-actions">
        <button type="button" class="button secondary" id="theme-toggle" title="Day" aria-label="Switch theme">☀</button>
      </div>
      <button type="button" class="button secondary" id="lang-toggle" data-i18n="lang_toggle">EN</button>
    </div>
  </header>
  <main class="wrapper">
    <header class="page-intro">
      <h1>Tags</h1>
      <p class="lede" data-i18n="tags_redirect">旧标签页已合并到归档。正在跳转…</p>
      <p class="meta-line"><a href="/archives/">→ Archive</a></p>
    </header>
  </main>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      SiteI18n.register({
        zh: { tags_redirect: "旧标签页已合并到归档与随笔筛选。若未自动跳转，请点下方链接。" },
        en: { tags_redirect: "Legacy tags moved into Archive / Notes filters. Use the links below if you are not redirected." },
      });
      SiteI18n.apply(SiteI18n.getLang());
    });
  </script>
</body>
</html>
