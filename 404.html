<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        document.documentElement.setAttribute("data-theme", t === "day" ? "day" : "night");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "night");
      }
    })();
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 · FUSION!</title>
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <script src="/assets/js/i18n.js" defer></script>
  <script src="/assets/js/site.js" defer></script>
</head>
<body data-title-key="page_title">
  <header class="site-header">
    <div class="wrapper header-inner">
      <div class="brand">
        <a href="/">
          <img src="/images/avatar.png" alt="" width="42" height="42" />
          <div class="brand-text">
            <div class="title">FUSION!</div>
            <div class="subtitle" data-i18n="brand_sub">朱博文</div>
          </div>
        </a>
      </div>
      <nav class="nav">
        <a data-i18n="nav_home" href="/">首页</a>
        <a data-i18n="nav_research" href="/research/">研究</a>
        <a data-i18n="nav_notes" href="/notes/">随笔</a>
        <a data-nav="videos" data-i18n="nav_videos" href="/videos/">Videos</a>
        <a data-i18n="nav_about" href="/about/">关于</a>
      </nav>
      <div class="header-actions">
        <button type="button" class="button secondary" id="theme-toggle" title="Day" aria-label="Switch theme">☀</button>
      </div>
      <button type="button" class="button secondary" id="lang-toggle" data-i18n="lang_toggle">EN</button>
    </div>
  </header>
  <main class="wrapper">
    <header class="page-intro">
      <h1 data-i18n="not_found_title">页面不存在</h1>
      <p class="lede" data-i18n="not_found_sub">链接可能已变更。请用顶部导航返回。</p>
    </header>
  </main>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      SiteI18n.register({
        zh: { page_title: "404 · FUSION!", not_found_title: "页面不存在", not_found_sub: "链接可能已变更。回首页或去归档看看。" },
        en: { page_title: "404 · FUSION!", not_found_title: "Page not found", not_found_sub: "The link may have moved. Try the home page or archive." },
      });
      SiteI18n.apply(SiteI18n.getLang());
    });
  </script>
</body>
</html>
