<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        document.documentElement.setAttribute("data-theme", t === "day" ? "day" : "night");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "night");
      }
    })();
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Personal notes and essays by Bowen Zhu." />
  <title>Notes · FUSION!</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <script src="/assets/js/i18n.js" defer></script>
  <script src="/assets/js/site.js" defer></script>
</head>
<body data-title-key="page_title">
  <header class="site-header">
    <div class="wrapper header-inner">
      <div class="brand">
        <a href="/">
          <img src="/images/avatar.png" alt="" width="42" height="42" />
          <div class="brand-text">
            <div class="title">FUSION!</div>
            <div class="subtitle" data-i18n="brand_sub">朱博文</div>
          </div>
        </a>
      </div>
      <nav class="nav" aria-label="Primary">
        <a data-nav="home" data-i18n="nav_home" href="/">首页</a>
        <a data-nav="research" data-i18n="nav_research" href="/research/">研究</a>
        <a data-nav="notes" data-i18n="nav_notes" href="/notes/">随笔</a>
        <a data-nav="videos" data-i18n="nav_videos" href="/videos/">视频</a>
        <a data-nav="about" data-i18n="nav_about" href="/about/">关于</a>
        <a data-nav="archives" data-i18n="nav_archives" href="/archives/">归档</a>
      </nav>
      <div class="header-actions">
        <button type="button" class="button secondary" id="theme-toggle" title="Day" aria-label="Switch theme">☀</button>
        <button type="button" class="button secondary" id="lang-toggle" data-i18n="lang_toggle">EN</button>
      </div>
    </div>
  </header>

  <main class="wrapper">
    <header class="page-intro">
      <h1 data-i18n="hero_title">随笔</h1>
      <p class="lede" data-i18n="hero_sub">个人兴趣、工程笔记与杂谈。</p>
    </header>

    <section class="section">
      <div id="filter-bar" class="filter-bar" aria-label="Filters"></div>
      <div id="notes-list" class="post-grid" role="list"></div>
      <p id="notes-error" class="muted" style="display:none;"></p>
    </section>
  </main>

  <footer class="site-footer wrapper">
    <div data-i18n="footer_line1">朱博文 · 等离子体计算 / 物理信息机器学习</div>
    <div data-i18n="footer_line2">drawingsword.com · 静态托管于 GitHub Pages</div>
  </footer>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      SiteI18n.register({
        zh: {
          page_title: "随笔 · FUSION!",
          hero_title: "随笔",
          hero_sub: "个人兴趣、工程笔记与杂谈。",
        },
        en: {
          page_title: "Notes · FUSION!",
          hero_title: "Notes",
          hero_sub: "Personal notes, builds, and miscellany.",
        },
      });
      document.body.setAttribute("data-title-key", "page_title");
      SiteI18n.apply(SiteI18n.getLang());

      let all = [];
      let tag = "all";

      async function boot() {
        try {
          const data = await Site.loadJSON("/data/posts.json");
          all = (data.posts || []).filter((p) => p.lane === "notes" && !p.hidden);
          buildFilters();
          render();
        } catch (e) {
          console.error(e);
          const err = document.getElementById("notes-error");
          if (err) {
            err.style.display = "block";
            err.textContent = SiteI18n.t("load_error");
          }
        }
      }

      function buildFilters() {
        const bar = document.getElementById("filter-bar");
        if (!bar) return;
        const tags = new Set();
        all.forEach((p) => (p.tags || []).forEach((t) => tags.add(t)));
        const list = ["all", ...Array.from(tags).sort()];
        bar.innerHTML = list
          .map((t) => {
            const label = t === "all" ? SiteI18n.t("filter_all") : t;
            return `<button type="button" data-tag="${Site.escapeHtml(t)}" class="${t === tag ? "is-active" : ""}">${Site.escapeHtml(label)}</button>`;
          })
          .join("");
        bar.querySelectorAll("button").forEach((btn) => {
          btn.addEventListener("click", () => {
            tag = btn.getAttribute("data-tag") || "all";
            buildFilters();
            render();
          });
        });
      }

      function render() {
        const lang = SiteI18n.getLang();
        let list = all.slice();
        if (tag !== "all") list = list.filter((p) => (p.tags || []).includes(tag));
        Site.renderPostList(document.getElementById("notes-list"), list, lang, { showLane: false });
        // rebuild filter labels on lang change
        const bar = document.getElementById("filter-bar");
        if (bar && !bar.dataset.listening) {
          bar.dataset.listening = "1";
        }
      }

      document.addEventListener("site:lang", () => {
        buildFilters();
        render();
      });
      boot();
    });
  </script>
</body>
</html>
