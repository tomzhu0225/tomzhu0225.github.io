<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        document.documentElement.setAttribute("data-theme", t === "day" ? "day" : "night");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "night");
      }
    })();
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Bowen Zhu (朱博文) — plasma simulation, kinetic methods, physics-informed ML. Personal site: research + notes." />
  <title>FUSION! · Bowen Zhu</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <script src="/assets/js/i18n.js" defer></script>
  <script src="/assets/js/site.js" defer></script>
</head>
<body data-title-key="page_title">
  <header class="site-header">
    <div class="wrapper header-inner">
      <div class="brand">
        <a href="/" aria-label="Home">
          <img src="/images/avatar.png" alt="" width="42" height="42" />
          <div class="brand-text">
            <div class="title">FUSION!</div>
            <div class="subtitle" data-i18n="brand_sub">朱博文</div>
          </div>
        </a>
      </div>
      <nav class="nav" aria-label="Primary">
        <a data-nav="home" data-i18n="nav_home" href="/">首页</a>
        <a data-nav="research" data-i18n="nav_research" href="/research/">研究</a>
        <a data-nav="notes" data-i18n="nav_notes" href="/notes/">随笔</a>
        <a data-nav="videos" data-i18n="nav_videos" href="/videos/">视频</a>
        <a data-nav="about" data-i18n="nav_about" href="/about/">关于</a>
        <a data-nav="archives" data-i18n="nav_archives" href="/archives/">归档</a>
      </nav>
      <div class="header-actions">
        <button type="button" class="button secondary" id="theme-toggle" title="Day" aria-label="Switch theme">☀</button>
        <button type="button" class="button secondary" id="lang-toggle" data-i18n="lang_toggle">EN</button>
      </div>
    </div>
  </header>

  <main class="wrapper">
    <header class="page-intro">
      <h1 data-i18n="hero_title">朱博文</h1>
      <p class="lede" data-i18n="hero_sub">西安交通大学博士生。等离子体数值模拟与诊断反演。</p>
      <p class="meta-line">
        <span data-i18n="badge_phd">PhD · XJTU</span>
        <span data-i18n="hero_kicker">等离子体 · 动理学 · 物理信息 ML</span>
      </p>
    </header>

    <section class="section">
      <div class="section-header">
        <div>
          <h2 data-i18n="latest_research">代表性成果</h2>
          <p data-i18n="feat_research_desc">部分近期工作。</p>
        </div>
      </div>
      <div id="featured-pubs" class="pub-grid" role="list"></div>
    </section>

    <section class="section">
      <div class="section-header">
        <div>
          <h2 data-i18n="feat_videos">视频</h2>
          <p data-i18n="feat_videos_desc">仿真精选 · Bilibili</p>
        </div>
        <a class="button secondary" href="/videos/" data-i18n="view_all">查看全部</a>
      </div>
      <div id="featured-videos" class="video-grid-home"></div>
    </section>

    <section class="section">
      <div class="section-header">
        <div>
          <h2 data-i18n="latest_notes">精选随笔</h2>
          <p data-i18n="feat_notes_desc">部分笔记与项目。</p>
        </div>
      </div>
      <div id="featured-notes" class="post-grid" role="list"></div>
      <p id="home-error" class="muted" style="display:none;margin-top:12px;"></p>
    </section>
  </main>

  <footer class="site-footer wrapper">
    <div data-i18n="footer_line1">朱博文 · 等离子体计算 / 物理信息机器学习</div>
    <div data-i18n="footer_line2">drawingsword.com · 静态托管于 GitHub Pages</div>
    <div>
      <a href="https://github.com/tomzhu0225" target="_blank" rel="noopener">GitHub</a>
      ·
      <a href="https://www.linkedin.com/in/bowen-zhu-52ba181b9/" target="_blank" rel="noopener">LinkedIn</a>
      ·
      <a href="https://space.bilibili.com/64849811" target="_blank" rel="noopener">Bilibili</a>
      ·
      <a href="mailto:tomzhu0225@stu.xjtu.edu.cn">Email</a>
    </div>
  </footer>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      SiteI18n.register({
        zh: {
          page_title: "FUSION! · 朱博文",
          hero_title: "朱博文",
          hero_sub: "西安交通大学博士生。等离子体数值模拟与诊断反演。",
          hero_kicker: "等离子体 · 动理学 · 物理信息 ML",
          feat_research_desc: "部分近期工作。",
          feat_notes_desc: "部分笔记与项目。",
          feat_videos: "视频",
          feat_videos_desc: "仿真精选 · Bilibili",
        },
        en: {
          page_title: "FUSION! · Bowen Zhu",
          hero_title: "Bowen Zhu",
          hero_sub: "PhD student at Xi’an Jiaotong University. Plasma numerics and diagnostic inversion.",
          hero_kicker: "Plasma · Kinetics · Physics-informed ML",
          feat_research_desc: "Selected recent work.",
          feat_notes_desc: "Selected notes and projects.",
          feat_videos: "Videos",
          feat_videos_desc: "Selected simulations · Bilibili",
        },
      });
      document.body.setAttribute("data-title-key", "page_title");
      SiteI18n.apply(SiteI18n.getLang());

      let postsCache = null;
      let researchCache = null;

      async function boot() {
        try {
          const [postsData, researchData] = await Promise.all([
            Site.loadJSON("/data/posts.json"),
            Site.loadJSON("/data/research.json"),
          ]);
          postsCache = postsData.posts || [];
          researchCache = researchData;
          render();
        } catch (e) {
          console.error(e);
          const err = document.getElementById("home-error");
          if (err) {
            err.style.display = "block";
            err.textContent = SiteI18n.t("load_error");
          }
        }
      }

      function render() {
        const lang = SiteI18n.getLang();
        // research highlights from pubs
        const pubBox = document.getElementById("featured-pubs");
        if (pubBox && researchCache) {
          const pubs = (researchCache.publications || []).slice(0, 3);
          pubBox.innerHTML = pubs.map((p) => Site.pubItem(p, lang)).join("");
        }
        // featured notes / posts
        const noteBox = document.getElementById("featured-notes");
        if (noteBox && postsCache) {
          const featured = postsCache
            .filter((p) => p.featured && !p.hidden)
            .slice(0, 6);
          Site.renderPostList(noteBox, featured, lang);
        }
        // featured bilibili sims
        const vidBox = document.getElementById("featured-videos");
        if (vidBox && researchCache) {
          const vids = (researchCache.videos || [])
            .filter((v) => v.featured && v.kind !== "science")
            .slice(0, 3);
          Site.renderVideoList(vidBox, vids, lang);
        }
      }

      document.addEventListener("site:lang", render);
      boot();
    });
  </script>
</body>
</html>
